<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <title>ZERO</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app" id="app">
    <section class="screen active" id="homeScreen">
      <header class="topbar">
        <div>
          <div class="brand">ZERO</div>
          <div class="my-id" id="myIdLabel">MY ID: ----</div>
        </div>
        <div class="online"><span></span> ONLINE</div>
      </header>

      <div class="home-body">
        <button class="peer-button" id="peerButton" type="button">
          <span class="peer-id" id="peerIdLabel">ID ----</span>
          <span class="peer-state" id="peerStateLabel">TAP TO CALL</span>
        </button>
      </div>

      <nav class="bottom-nav" aria-label="Navigation">
        <button type="button" class="nav active">CONTACTS</button>
        <button type="button" class="nav" disabled>KEYPAD</button>
        <button type="button" class="nav" disabled>RECENTS</button>
      </nav>
    </section>

    <section class="screen" id="incomingScreen">
      <div class="call-layout">
        <div class="call-title">INCOMING CALL</div>
        <div class="avatar">Z</div>
        <div class="call-id" id="incomingId">ID ----</div>
        <div class="call-sub">ZERO INTERNET CALL</div>
        <div class="incoming-actions">
          <button type="button" class="round danger" id="declineButton" aria-label="Decline">✕</button>
          <button type="button" class="round success" id="answerButton" aria-label="Answer">☎</button>
        </div>
        <div class="action-labels"><span>DECLINE</span><span>ANSWER</span></div>
      </div>
    </section>

    <section class="screen" id="activeScreen">
      <div class="call-layout active-call">
        <div class="call-title" id="activeStatus">CONNECTING...</div>
        <div class="avatar">Z</div>
        <div class="call-id" id="activeId">ID ----</div>
        <div class="timer" id="callTimer">00:00</div>

        <div class="call-controls">
          <button type="button" class="control" id="muteButton"><span>🎙</span>MUTE</button>
          <button type="button" class="control" id="speakerButton"><span>🔊</span>SPEAKER</button>
          <button type="button" class="control" disabled><span>⌨</span>KEYPAD</button>
        </div>

        <button type="button" class="end-button" id="endButton">☎</button>
        <div class="end-label">END CALL</div>
      </div>
    </section>

    <section class="screen" id="setupScreen">
      <div class="setup-card">
        <div class="brand">ZERO</div>
        <h1>TEST DEVICE</h1>
        <p>Choose the ID for this phone.</p>
        <button type="button" class="setup-choice" data-id="1001">USE ID 1001</button>
        <button type="button" class="setup-choice" data-id="1002">USE ID 1002</button>
        <p class="small">For the first test use a different ID on each phone.</p>
      </div>
    </section>
  </main>

  <audio id="remoteAudio" autoplay playsinline></audio>
  <audio id="ringtone" src="assets/zero-ringtone.mp3" loop preload="auto"></audio>
  <script src="app.js"></script>
</body>
</html>
